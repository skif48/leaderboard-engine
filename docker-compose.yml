services:
  scylla:
    image: scylladb/scylla:2025.1.3
    ports:
      - 9042:9042
      - 9180:9180 # native Prometheus metrics, scraped via prometheus.yml
      
  zoo1:
    image: confluentinc/cp-zookeeper:7.8.0
    hostname: zoo1
    container_name: zoo1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zoo1:2888:3888

  kafka1:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9999:9999"
    environment:
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://localhost:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    depends_on:
      - zoo1
    # "Healthy" means the broker answers API requests, not just that the JVM
    # started. Exporters and UIs that dial the broker at startup wait on this.
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  provectus:
    image: provectuslabs/kafka-ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: true
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:19092
    depends_on:
      kafka1:
        condition: service_healthy

  # Consumer-group lag and topic offsets as Prometheus metrics on :9308.
  # Scraped by the metrics stack via host.docker.internal (see prometheus.yml).
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    command:
      - --kafka.server=kafka1:19092
      - --kafka.version=3.8.0
      - --topic.exclude=^__.*
    ports:
      - "9308:9308"
    depends_on:
      kafka1:
        condition: service_healthy
    restart: unless-stopped

  # Per-node Redis metrics on :9121. Runs in multi-target mode: the scrape
  # config passes each cluster node as ?target= (see prometheus.yml).
  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    command:
      - --redis.addr=
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: grokzen/redis-cluster:7.0.10
    ports:
      - "6379:6379"
      - "6380:6380"
      - "6381:6381"
      - "6382:6382"
      - "6383:6383"
      - "6384:6384"
    environment:
      INITIAL_PORT: 6379
      IP: 0.0.0.0
    # grokzen starts six redis processes and then runs `redis-cli --cluster
    # create`; nodes answer LOADING/CLUSTERDOWN until that finishes.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 cluster info | grep -q cluster_state:ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
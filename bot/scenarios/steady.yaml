# Steady background load: a constant population with a trickle of new sign-ups.
#
# Numbers are PER BOT INSTANCE. Approximate request rate per instance:
#   sum over active sessions of 1 / mean think_time (+ leaderboard views)
#   400 sessions x (0.5/3s + 0.5/0.6s) ~= 400 actions/s
#
# Personas are shared by the bundled scenarios; copy this file to define your own.
name: steady
loop: false
excess_sessions: drain

personas:
  casual:
    actions: {spawn: 5, some: 3, heal: 3, save: 2, damage: 4, kill: 2, upgrade_armor: 1, upgrade_weapon: 1, double_kill: 0.5, triple_kill: 0.1}
    think_time:     {mean: 3s, stddev: 1500ms, min: 300ms, max: 15s}
    session_length: {mean: 3m, stddev: 1m, min: 30s, max: 8m}
    leaderboard_view_prob: 0.02
  grinder:
    actions: {damage: 6, kill: 5, double_kill: 2, triple_kill: 1, heal: 2, upgrade_weapon: 1, upgrade_armor: 1, spawn: 1}
    think_time:     {mean: 600ms, stddev: 200ms, min: 100ms, max: 2s}
    session_length: {mean: 10m, stddev: 3m, min: 2m, max: 20m}
    leaderboard_view_prob: 0.005

phases:
  # duration 0 on the last phase means "hold forever" (until SIGTERM).
  - name: steady
    duration: 0
    active_users: 400
    new_user_ratio: 0.05
    persona_mix: {casual: 5, grinder: 5}

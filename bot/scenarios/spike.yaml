# Traffic spike: quiet baseline, a sharp 10x ramp dominated by new users, a
# short peak, an abrupt crash (sessions are cancelled, not drained), recovery.
#
# Numbers are PER BOT INSTANCE. Approximate request rate per instance:
#   baseline  50 sessions ~= 30 actions/s
#   peak     500 sessions ~= 350 actions/s (grinder-heavy mix)
# Ends after ~9 minutes and exits 0 unless BOT_LOOP_SCENARIO=true.
name: spike
loop: false
excess_sessions: drain

personas:
  casual:
    actions: {spawn: 5, some: 3, heal: 3, save: 2, damage: 4, kill: 2, upgrade_armor: 1, upgrade_weapon: 1, double_kill: 0.5, triple_kill: 0.1}
    think_time:     {mean: 3s, stddev: 1500ms, min: 300ms, max: 15s}
    session_length: {mean: 3m, stddev: 1m, min: 30s, max: 8m}
    leaderboard_view_prob: 0.02
  grinder:
    actions: {damage: 6, kill: 5, double_kill: 2, triple_kill: 1, heal: 2, upgrade_weapon: 1, upgrade_armor: 1, spawn: 1}
    think_time:     {mean: 800ms, stddev: 300ms, min: 100ms, max: 3s}
    session_length: {mean: 10m, stddev: 3m, min: 2m, max: 20m}
    leaderboard_view_prob: 0.005
  spectator:
    actions: {some: 1, save: 1}
    think_time:     {mean: 8s, stddev: 3s, min: 2s, max: 20s}
    session_length: {mean: 2m, stddev: 30s, min: 30s, max: 4m}
    leaderboard_view_prob: 0.5

phases:
  - name: baseline
    duration: 3m
    active_users: 50
    new_user_ratio: 0.1
    persona_mix: {casual: 6, grinder: 2, spectator: 2}
  - name: ramp-up
    duration: 30s
    active_users: {to: 500}      # `from` is inherited from the previous phase (50)
    new_user_ratio: 0.7
    persona_mix: {casual: 5, grinder: 4, spectator: 1}
  - name: peak
    duration: 2m
    active_users: 500
    new_user_ratio: 0.3
    persona_mix: {casual: 5, grinder: 4, spectator: 1}
  - name: crash
    duration: 15s
    active_users: {to: 50}
    excess_sessions: cancel      # shed the newest sessions instead of letting them finish
    new_user_ratio: 0
    persona_mix: {casual: 1}
  - name: recovery
    duration: 3m
    active_users: 50
    new_user_ratio: 0.1
    persona_mix: {casual: 6, grinder: 2, spectator: 2}

# Exposes the bot's /metrics for scraping. The bot has no other HTTP surface.
apiVersion: v1
kind: Service
metadata:
  name: leaderboard-bot-metrics
  labels:
    app.kubernetes.io/name: leaderboard-bot
    app.kubernetes.io/component: load-generator
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: leaderboard-bot
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics

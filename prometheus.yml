global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'my-app'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Local bot run: `go run ./bot` serves metrics on BOT_METRICS_PORT (default 9100).
  - job_name: 'bot'
    static_configs:
      - targets: ['host.docker.internal:9100']
    metrics_path: '/metrics'
    scrape_interval: 10s
